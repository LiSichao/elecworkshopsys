<!DOCTYPE html>
<html>
<body>
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>备品管理</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="index">首页</a></li>
                    <li class="breadcrumb-item active">备品管理</li>
                </ol>
            </div>
        </div>
    </div>
    <!-- /.container-fluid -->
</section>
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-info card-outline">
                    <div class="card-header">
                        <h3 class="card-title">列表</h3>
                        <div class="card-tools">
                            <button id="btnAdd" type="button" class="btn btn-info btn-sm">新增</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <table id="recordTable" class="table table-striped">
                            <thead>
                            <tr>
                                <th>类型</th>
                                <th>存放地点</th>
                                <th>状态</th>
                                <th>备品名称</th>
                                <th>规格型号</th>
                                <th>生产厂家</th>
                                <th>出厂编号</th>
                                <th>备注</th>
                                <th style="width:180px;"></th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer">
                        <div class="row">
                            <div class="col-md-6">
                                <div id="paginationInfo" class="dataTables_info text-muted"></div>
                            </div>
                            <div class="col-md-6">
                                <div id="paginationArea"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalAdd">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <div class="form-group">
                    <label>类型</label>
                    <select name="type" class="form-control">
                        <option value="1">连锁</option>
                        <option value="2">TDCS/CTC</option>
                        <option value="3">监测</option>
                        <option value="4">列控</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>存放地点</label>
                    <select name="stationId" class="form-control">
                        <option value="0">电子车间</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select name="state" class="form-control">
                        <option value="1">在用</option>
                        <option value="2">备用</option>
                        <option value="3">返修</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备品名称<span class="text-danger"> *</span></label>
                    <input name="name" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>规格型号<span class="text-danger"> *</span></label>
                    <input name="model" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>生产厂家</label>
                    <input name="factory" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>出厂编号</label>
                    <input name="code" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea name="remark" rows="2" class="form-control"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-info" data-dismiss="modal" id="submitAdd">提交</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEdit">
    <div class="modal-dialog ">
        <div class="modal-content">
            <div class="modal-body">
                <input name="id" type="hidden" class="form-control">
                <div class="form-group">
                    <label>类型</label>
                    <select name="type" class="form-control">
                        <option value="1">连锁</option>
                        <option value="2">TDCS/CTC</option>
                        <option value="3">监测</option>
                        <option value="4">列控</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>存放地点</label>
                    <select name="stationId" class="form-control">
                        <option value="0">电子车间</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select name="state" class="form-control">
                        <option value="1">在用</option>
                        <option value="2">备用</option>
                        <option value="3">返修</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备品名称<span class="text-danger"> *</span></label>
                    <input name="name" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>规格型号<span class="text-danger"> *</span></label>
                    <input name="model" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>生产厂家</label>
                    <input name="factory" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>出厂编号</label>
                    <input name="code" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea name="remark" rows="2" class="form-control"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-info" data-dismiss="modal" id="submitEdit">提交</button>
            </div>
        </div>
    </div>
</div>

<myscript>
    <script id="tmpl" type="text/x-template">
        <tr>
            <td>
                {{if type==1}}
                <span class="badge badge-primary text-sm">连锁</span>
                {{else type==2}}
                <span class="badge badge-primary text-sm">TDCS/CTC</span>
                {{else type==3}}
                <span class="badge badge-primary text-sm">监测</span>
                {{else type==4}}
                <span class="badge badge-primary text-sm">列控</span>
                {{/if}}
            </td>
            <td>{{:station?station.name:"电子车间"}}</td>
            <td>
                {{if state==1}}
                <span class="badge badge-success text-sm">在用</span>
                {{else state==2}}
                <span class="badge badge-info text-sm">备用</span>
                {{else state==3}}
                <span class="badge badge-danger text-sm">返修</span>
                {{/if}}
            </td>
            <td>{{:name}}</td>
            <td>{{:model}}</td>
            <td>{{:factory}}</td>
            <td>{{:code}}</td>
            <td>{{:remark}}</td>

            <td class="text-right">
                <button class="btn btn-info btn-sm btnEdit" data-id="{{:id}}"
                        data-name="{{:name}}" data-type="{{:type}}" data-remark="{{:remark}}"
                        data-code="{{:code}}" data-station-id="{{:stationId}}" data-state="{{:state}}"
                        data-model="{{:model}}" data-factory="{{:factory}}">修改
                </button>
                <button class="btn btn-danger btn-sm btnDel" data-id="{{:id}}">删除</button>
            </td>
        </tr>
    </script>
    <script type="text/javascript">
        $(function () {
            toPage(pageNum);
            getStation();
        });

        function toPage(pn) {
            pageNum = pn;
            $.ajax({
                url: "api/spare",
                type: "GET",
                data: {
                    pageNum: pn,
                    pageSize: 10,
                },
                success: function (result) {
                    $("#recordTable tbody").empty().append($("#tmpl").render(result.data));
                    buildPageNav(result);
                }
            });
        }

        function getStation() {
            $.ajax({
                url: "api/station",
                type: "GET",
                data: {
                    state: 1
                },
                success: function (result) {
                    $.each(result.data, function (index, item) {
                        var option = $("<option></option>").attr("value", item.id).text(item.name);
                        $("#modalAdd :input[name='stationId'],#modalEdit :input[name='stationId']").append(option);
                    })

                }
            });
        }

        $(document).on("click", "#btnAdd", function () {
            $("#modalAdd").modal({
                backdrop: "static"
            });
            $('#modalAdd input,#modalAdd textarea').val('');
        });

        $(document).on('click', '#submitAdd', function () {
            let data = $("#modalAdd :input").serializeJSON();
            if (data.name === "") {
                Toast.fire({text: '信息填写不完整'});
                return false;
            }
            $.ajax({
                url: "api/spare",
                type: "POST",
                data: data,
                success: function (result) {
                    if (result.status === 'success') {
                        Toast.fire({text: result.message});
                        toPage(pageNum);
                    } else {
                        Toast.fire({text: result.message});
                    }
                }
            });
        });

        $(document).on("click", ".btnEdit", function () {
            $("#modalEdit").modal({
                backdrop: "static"
            });
            $.each($(this).data(), function (name, value) {
                $("#modalEdit :input[name='" + name + "']").val(value);
            })
        });

        $(document).on('click', '#submitEdit', function () {
            let data = $("#modalEdit :input").serializeJSON();
            $.ajax({
                url: "api/spare",
                type: "PUT",
                data: data,
                success: function (result) {
                    Toast.fire({text: result.message});
                    toPage(pageNum);
                }
            });
        });

        $(document).on('click', '.btnDel', function () {
            $.ajax({
                url: "api/spare",
                type: "PUT",
                data: {
                    id: $(this).data('id'),
                    state: 0,
                },
                success: function (result) {
                    Toast.fire({text: result.message});
                    toPage(pageNum);
                }
            });
        });

    </script>
</myscript>
</body>
</html>
