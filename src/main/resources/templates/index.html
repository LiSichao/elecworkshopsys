<!DOCTYPE html>
<html>
<head>
    <style>
        .bg-warning, .bg-warning a {
            color: white !important
        }
    </style>
</head>
<body>
<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>主页</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="index">首页</a></li>
                    <li class="breadcrumb-item active">主页</li>
                </ol>
            </div>
        </div>
    </div>
    <!-- /.container-fluid -->
</section>
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-3 col-6">
                <div class="small-box bg-info">
                    <div class="inner">
                        <h3 id="faultCount">0</h3>
                        <p>故障总数</p>
                    </div>
                    <div class="icon">
                        <i class="ion ion-bag"></i>
                    </div>
                    <a href="fault" class="small-box-footer">查看 <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
            <div class="col-lg-3 col-6">
                <div class="small-box bg-success">
                    <div class="inner">
                        <h3 id="spareCount">0</h3>
                        <p>备品总数</p>
                    </div>
                    <div class="icon">
                        <i class="ion ion-stats-bars"></i>
                    </div>
                    <a href="spare" class="small-box-footer">查看 <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
            <div class="col-lg-3 col-6">
                <div class="small-box bg-warning">
                    <div class="inner">
                        <h3 id="stationCount">0</h3>
                        <p>车站总数</p>
                    </div>
                    <div class="icon">
                        <i class="ion ion-person-add"></i>
                    </div>
                    <a href="station" class="small-box-footer">查看 <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
            <div class="col-lg-3 col-6">
                <div class="small-box bg-danger">
                    <div class="inner">
                        <h3 id="userCount">0</h3>
                        <p>用户总数</p>
                    </div>
                    <div class="icon">
                        <i class="ion ion-pie-graph"></i>
                    </div>
                    <a href="user" class="small-box-footer">查看 <i class="fas fa-arrow-circle-right"></i></a>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header border-0">
                        <h3 class="card-title">今日待办</h3>
                        <div class="card-tools">
                            <a href="fault" class="btn btn-tool btn-sm">
                                <i class="fas fa-bars"></i>
                            </a>
                        </div>
                    </div>
                    <div id="notice" class="card-body">
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header border-0">
                        <h3 class="card-title">近一周故障统计</h3>
                        <div class="card-tools">
                            <a href="fault" class="btn btn-tool btn-sm">
                                <i class="fas fa-bars"></i>
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="container" style="height: 500px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<myscript>
    <script src="plugins/moment/moment.min.js"></script>
    <script type="text/javascript" src="js/echarts.min.js"></script>
    <script id="tmpl" type="text/x-template">
        {{if data.length==0}}
        <strong class="text-info">
            <i class="fas fa-check mr-1"></i>
            无待办事项
        </strong>
        {{/if}}
        {{for data}}
        <strong class="text-info">
            <i class="fas fa-bell mr-1"></i>
            {{:fault.station?fault.station.name:fault.dept.name}} - {{:fault.datetime}}
        </strong>
        <p class="text-muted mb-0">
            {{:fault.detail}}
        </p>
        <p class="text-muted text-bold">
            {{:detail}}
        </p>
        {{if #index<~root.length-1}}<hr>{{/if}}
        {{/for}}
    </script>
    <script type="text/javascript">
        $(function () {
            getCount("fault");
            getCount("spare");
            getCount("station");
            getCount("user");
            getProcess();
            getChart();
        })

        function getCount(type) {
            $.ajax({
                url: "api/" + type + "/count",
                type: "GET",
                success: function (result) {
                    $("#" + type + "Count").numberRock({
                        lastNumber: result.data,
                        duration: 500,
                        easing: 'linear',  //慢快慢
                    });
                }
            });
        }

        function getProcess() {
            $.ajax({
                url: "api/process",
                type: "GET",
                data: {
                    notice: 1,
                    noticeDate: moment().format("YYYY-MM-DD"),
                    state: 1
                },
                success: function (result) {
                    $("#notice").empty().append($("#tmpl").render(result));

                }
            });
        }

        function getChart() {
            $.ajax({
                url: "api/fault/chart",
                type: "GET",
                success: function (result) {
                    showChart(result.data);
                }
            });
        }

        function showChart(data) {
            var dom = document.getElementById("container");
            var myChart = echarts.init(dom);
            var option = {
                legend: {},
                tooltip: {},
                dataset: {
                    dimensions: ['date', '故障总数', '已处理', '处理中', '待处理'],
                    source: data
                },
                xAxis: {type: 'category', axisLabel: {interval: 0, rotate: 30}},
                yAxis: {},
                series: [
                    {type: 'bar'},
                    {type: 'bar'},
                    {type: 'bar'},
                    {type: 'bar'}
                ]
            };
            if (option && typeof option === 'object') {
                myChart.setOption(option);
            }
            window.onresize = myChart.resize;
        }

        $.fn.numberRock = function (options) {
            var defaults = {
                lastNumber: 100,
                duration: 2000,
                easing: 'swing'  //swing(默认 : 缓冲 : 慢快慢)  linear(匀速的)
            };
            var opts = $.extend({}, defaults, options);

            $(this).animate({
                num: "numberRock"
            }, {
                duration: opts.duration,
                easing: opts.easing,
                complete: function () {
                    console.log("success");
                },
                step: function (a, b) {
                    $(this).html(parseInt(b.pos * opts.lastNumber));
                }
            });
        }

    </script>
</myscript>
</body>
</html>
